{% extends 'home.html' %}
{% block x_hero_cls %}x-hero-c{% endblock %}
{% block x_media %}
<div class="x-bp" data-bp aria-hidden="true">
  <svg class="x-bp-grid" viewBox="0 0 1600 900" preserveAspectRatio="xMaxYMid slice">
    <defs>
      <pattern id="bp-s" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#1679b4" stroke-opacity=".07" stroke-width="1"/></pattern>
      <pattern id="bp-l" width="100" height="100" patternUnits="userSpaceOnUse"><rect width="100" height="100" fill="url(#bp-s)"/><path d="M100 0H0V100" fill="none" stroke="#1679b4" stroke-opacity=".13" stroke-width="1"/></pattern>
    </defs>
    <rect width="1600" height="900" fill="url(#bp-l)"/>
  </svg>
  <svg class="x-bp-lines x-bp-call" viewBox="0 0 1600 900">
    <g fill="none" stroke="#1679b4" stroke-width="1.6" stroke-opacity=".6" font-family="Manrope,Arial" font-size="20" font-weight="600">
      <path d="M1010 250 L920 150 H740"/><circle cx="1010" cy="250" r="5" fill="#1679b4"/>
      <text x="740" y="138" fill="#1679b4" stroke="none">A · Steuerteil</text>
      <path d="M1300 610 L1180 640 H960"/><circle cx="1300" cy="610" r="5" fill="#1679b4"/>
      <text x="960" y="628" fill="#1679b4" stroke="none">B · Einführungsschlauch</text>
      <path d="M1470 150 L1500 60 H1560"/><circle cx="1470" cy="150" r="5" fill="#1679b4"/>
      <text x="1330" y="48" fill="#1679b4" stroke="none">C · Versorgungskabel</text>
    </g>
  </svg>
  <img class="x-bp-lines" src="/static/img/hero-blueprint.png?v={{ av }}" alt="" width="1600" height="900">
  <div class="x-lens" data-lens><div class="x-lens-img" data-lens-img></div><span class="x-lens-ring"></span></div>
  <span class="x-chip x-bp-hint" style="top:150px;right:auto;left:57%;bottom:auto">{{ icon('search') }}{{ {'de':'Mit der Maus über das Gerät fahren','en':'Move the cursor over the device','fr':'Survolez l’appareil','ru':'Наведите курсор на аппарат'}[lang] }}</span>
</div>
{% endblock %}
